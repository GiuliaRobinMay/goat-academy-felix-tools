<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Felix's Tools · GOAT Academy</title>
    <meta
      name="description"
      content="The three tools Felix built for the GOAT Academy community — the Winston App, the Visual Breakout Scanner and TradeVision."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐐</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
      <svg
        id="iconMoon"
        class="icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      ></svg>
      <svg
        id="iconSun"
        class="icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      ></svg>
    </button>

    <main class="stage">
      <h1 class="visually-hidden">Felix's Tools</h1>

      <div class="deck" id="deck"></div>

      <nav class="deck-nav" aria-label="Choose a tool">
        <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous tool"></button>
        <div class="dots" id="dots"></div>
        <button class="nav-btn" id="nextBtn" type="button" aria-label="Next tool"></button>
      </nav>

      <p class="deck-status" id="deckStatus"></p>
    </main>

    <div
      class="overlay"
      id="overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="detailTitle"
      aria-hidden="true"
    >
      <article class="detail" id="detail"></article>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
