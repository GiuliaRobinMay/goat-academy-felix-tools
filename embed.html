<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Felix's Tools — embed test</title>
    <style>
      body {
        margin: 0;
        padding: 2rem 1rem;
        background: #0d0d0f;
        color: #9aabb2;
        font: 400 15px/1.5 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Helvetica, Arial, sans-serif;
      }

      .page {
        max-width: 1200px;
        margin-inline: auto;
      }

      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.1rem;
        color: #f3f7f8;
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 0.9rem;
      }

      /* --- this is the part that gets pasted into Mighty Networks --- */
      .felix-tools-embed {
        position: relative;
        width: 100%;
        border: 0;
        border-radius: 16px;
        overflow: hidden;
        /* fallback height until the app reports its own */
        height: 900px;
      }

      @media (max-width: 700px) {
        .felix-tools-embed {
          height: 1800px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Felix's Tools — embed test</h1>
      <p>
        The iframe below is exactly what goes into the community. It resizes
        itself: the app posts its height to this page, and the script at the
        bottom applies it.
      </p>

      <iframe
        class="felix-tools-embed"
        id="felixTools"
        src="https://goat-academy-felix-tools.vercel.app/"
        title="Felix's Tools"
        loading="lazy"
        allow="clipboard-write"
      ></iframe>
    </div>

    <script>
      // Size the iframe to the app's own content height.
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.type !== 'felix-tools:height') return;
        var frame = document.getElementById('felixTools');
        var height = Math.min(Math.max(Number(data.height) || 0, 480), 3000);
        if (height && Math.abs(frame.offsetHeight - height) > 2) {
          frame.style.height = height + 'px';
        }
      });
    </script>
  </body>
</html>
